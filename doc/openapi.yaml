openapi: 3.1.0
info:
  title: Travel MCP HTTP API
  version: 1.1.0
  description: REST endpoints served by the Travel MCP HTTP process for travel search and authenticated favorites.
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://travel.arjanvandermeer.com
    description: Production server
tags:
  - name: Discovery
  - name: Search
  - name: Places
  - name: Favorites
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token accepted by the HTTP server.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
      additionalProperties: true
    City:
      type: object
      properties:
        geoname_id:
          type: integer
        name:
          type: string
        country_code:
          type: string
        country_name:
          type: string
        state:
          type: string
        population:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
      additionalProperties: true
    POI:
      type: object
      properties:
        osm_id:
          type: integer
        name:
          type: string
        osm_name:
          type: string
        poi_type:
          type: string
        city:
          type: string
        country_code:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        google_rating:
          type: number
        google_review_count:
          type: integer
        is_favorite:
          type: boolean
      additionalProperties: true
    SearchResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/POI'
        count:
          type: integer
      required:
        - results
        - count
paths:
  /api/v1/auth/config:
    get:
      tags: [Discovery]
      summary: Return the public OAuth issuer for the web client.
      responses:
        '200':
          description: OAuth issuer configuration.
        '503':
          description: Google sign-in is unavailable.
  /api/v1/auth/me:
    get:
      tags: [Discovery]
      summary: Return the current browser bearer-token profile when authenticated.
      responses:
        '200':
          description: Anonymous or authenticated browser profile.
  /health:
    get:
      tags: [Discovery]
      summary: Check HTTP server health.
      responses:
        '200':
          description: Server status and advertised endpoints.
  /openapi.yaml:
    get:
      tags: [Discovery]
      summary: Return this OpenAPI document.
      responses:
        '200':
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/search/cities:
    get:
      tags: [Search]
      summary: Search cities by country and text, or by coordinates.
      parameters:
        - name: country_code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
            default: 50
            maximum: 1000
        - name: min_pois
          in: query
          schema:
            type: integer
            default: 0
            maximum: 1000
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Matching cities.
        '400':
          description: country_code or complete coordinates are required.
  /api/v1/search/pois:
    get:
      tags: [Search]
      summary: Search POIs by name, city, coordinates, type, cuisine, or dietary filters.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: city_name
          in: query
          schema:
            type: string
        - name: country_code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
            default: 10
            maximum: 50
        - name: poi_type
          in: query
          schema:
            type: string
        - name: poi_types
          in: query
          schema:
            type: string
        - name: cuisine
          in: query
          schema:
            type: string
        - name: dietary
          in: query
          schema:
            type: string
        - name: open_now
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Matching POIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          description: q, city_name, or complete coordinates are required.
  /api/v1/poi/{osm_id}:
    get:
      tags: [Places]
      summary: Return full POI details.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: osm_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: POI details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POI'
        '400':
          description: Invalid osm_id.
        '404':
          description: POI not found.
  /api/v1/poi/{osm_id}/nearby:
    get:
      tags: [Places]
      summary: Return nearby POIs for a source place.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: osm_id
          in: path
          required: true
          schema:
            type: integer
        - name: radius
          in: query
          schema:
            type: number
            default: 1.5
            maximum: 10
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 20
        - name: types
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Nearby POIs and source metadata.
        '400':
          description: Invalid osm_id.
        '404':
          description: POI not found.
        '422':
          description: Source POI has no coordinates.
  /api/v1/favorites:
    get:
      tags: [Favorites]
      summary: List the authenticated user's favorites.
      security:
        - bearerAuth: []
      parameters:
        - name: poi_types
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        '200':
          description: Favorites and count.
        '401':
          description: Authentication required.
    post:
      tags: [Favorites]
      summary: Add a POI to the authenticated user's favorites.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                osm_id:
                  type: integer
                notes:
                  type: string
                  nullable: true
              required:
                - osm_id
      responses:
        '201':
          description: Favorite added.
        '400':
          description: osm_id is required.
        '401':
          description: Authentication required.
        '404':
          description: POI not found.
  /api/v1/favorites/{osm_id}:
    patch:
      tags: [Favorites]
      summary: Update notes for a favorite.
      security:
        - bearerAuth: []
      parameters:
        - name: osm_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Favorite updated.
        '400':
          description: Invalid osm_id.
        '401':
          description: Authentication required.
        '404':
          description: Favorite not found.
    delete:
      tags: [Favorites]
      summary: Remove a favorite.
      security:
        - bearerAuth: []
      parameters:
        - name: osm_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Favorite removal result.
        '400':
          description: Invalid osm_id.
        '401':
          description: Authentication required.
