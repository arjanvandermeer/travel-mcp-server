name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run lint

      - name: Credential scan
        run: node scripts/credential-scan.js

      - name: Maintenance review gate smoke
        run: npm run test:maintenance-gate-smoke

      - run: npm test
