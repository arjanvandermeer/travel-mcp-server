name: Deploy to ECS Fargate

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: travel-mcp-server
  ECS_CLUSTER: travel-mcp-cluster
  ECS_SERVICE: travel-mcp-service
  CONTAINER_NAME: travel-mcp-server
  SENTRY_ORG: arjan-van-der-meer
  SENTRY_PROJECT: travel-mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git info
        id: git-info
        run: |
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "commit_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          # Get version from package.json for Sentry release
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sentry_release=travel-mcp-server@${VERSION}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        continue-on-error: true  # Don't fail deployment if release creation fails
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: production
          release: ${{ steps.git-info.outputs.sentry_release }}

      - name: Build, tag, and push image to ECR
        uses: docker/build-push-action@v5
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            GIT_COMMIT=${{ steps.git-info.outputs.commit }}
            GIT_COMMIT_SHORT=${{ steps.git-info.outputs.commit_short }}
            GIT_BRANCH=${{ steps.git-info.outputs.branch }}
            GIT_TAG=${{ steps.git-info.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: set-image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition travel-mcp-task \
            --query taskDefinition > task-definition.json

      - name: Inject environment variables into task definition
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # Add/update environment variables in the container definition
          jq --arg sentry_dsn "$SENTRY_DSN" '
            .containerDefinitions[0].environment = (
              # Remove existing entries for these keys (if any)
              [.containerDefinitions[0].environment[]? | select(.name | IN("SENTRY_DSN", "TELEMETRY_ENABLED", "TELEMETRY_ENVIRONMENT", "TELEMETRY_SAMPLE_RATE") | not)]
              # Add fresh entries
              + [
                {"name": "SENTRY_DSN", "value": $sentry_dsn},
                {"name": "TELEMETRY_ENABLED", "value": "true"},
                {"name": "TELEMETRY_ENVIRONMENT", "value": "production"},
                {"name": "TELEMETRY_SAMPLE_RATE", "value": "1.0"}
              ]
            )
          ' task-definition.json > task-definition-updated.json
          mv task-definition-updated.json task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.set-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
