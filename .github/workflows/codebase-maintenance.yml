name: Codebase Maintenance Review

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the 7-day gate or path gate would skip"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  gate:
    name: Gate maintenance review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide whether review is due
        id: gate
        env:
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          FORCE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only -r HEAD > changed-files.txt || true
          echo "Changed files:"
          cat changed-files.txt
          last_review_at="$(gh run list --workflow "Codebase Maintenance Review" --status success --limit 20 --json createdAt --jq '.[0].createdAt // ""')"
          echo "Last successful maintenance review: ${last_review_at:-none}"
          export LAST_REVIEW_AT="$last_review_at"
          node scripts/maintenance-review-gate.js changed-files.txt

  review:
    name: Run maintenance review
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Capture deterministic check output
        run: |
          set +e
          mkdir -p .maintenance

          npm run lint > .maintenance/lint.txt 2>&1
          echo $? > .maintenance/lint.exit

          npm test > .maintenance/test.txt 2>&1
          echo $? > .maintenance/test.exit

          npm run test:coverage > .maintenance/test-coverage.txt 2>&1
          echo $? > .maintenance/test-coverage.exit

          npm audit --audit-level=moderate --json > .maintenance/npm-audit.json 2>&1
          echo $? > .maintenance/npm-audit.exit

      - name: Capture existing GitHub issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --state all --limit 200 \
            --json number,title,state,labels,body,url,updatedAt,closedAt \
            > .maintenance/github-issues.json

      - name: Run Codex maintenance review
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: doc/regular-codebase-review.md
          model: gpt-5.5
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Remove transient check output
        run: rm -rf .maintenance
