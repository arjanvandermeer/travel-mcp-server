<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explorer</title>
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>

  <!-- ─── Navbar ─── -->
  <nav class="navbar">
    <a href="#/" class="navbar-brand">Travel Explorer</a>
    <div class="navbar-right">
      <!-- Logged in -->
      <template x-data x-if="$store.auth.authenticated">
        <div style="display:flex;align-items:center;gap:16px;">
          <a href="#/favorites" style="color:white;text-decoration:none;font-size:14px;">My Favorites</a>
          <div class="user-menu" x-data="{ open: false }" @click.outside="open = false">
            <button class="user-toggle" @click="open = !open">
              <img x-show="$store.auth.user?.picture_url" :src="$store.auth.user?.picture_url" class="user-avatar" alt="">
              <span x-text="$store.auth.user?.name || $store.auth.user?.email"></span>
              <span style="font-size:10px">&#9662;</span>
            </button>
            <div class="user-dropdown" x-show="open" x-transition>
              <a href="#/favorites">My Favorites</a>
              <button @click="$store.auth.logout()">Logout</button>
            </div>
          </div>
        </div>
      </template>
      <!-- Anonymous -->
      <template x-data x-if="$store.auth.checked && !$store.auth.authenticated">
        <button class="btn-login" @click="$store.auth.login()">
          <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Sign in with Google
        </button>
      </template>
    </div>
  </nav>

  <!-- ─── Main content (SPA pages) ─── -->
  <div class="main" x-data>

    <!-- ─── SEARCH PAGE ─── -->
    <div x-show="$store.route.page === 'search'">

      <div class="search-panel">
        <h2>Explore Places</h2>

        <!-- Country -->
        <div class="form-group">
          <label>Country</label>
          <select class="form-select"
            x-model="$store.search.countryCode"
            @change="$store.search.onCountryChange()">
            <option value="">-- Select country --</option>
            <template x-for="c in $store.search.countries" :key="c.code">
              <option :value="c.code" x-text="c.name"></option>
            </template>
          </select>
        </div>

        <!-- State (visible after country selected) -->
        <div class="form-group" x-show="$store.search.countryCode && $store.search.states.length > 0">
          <label>State / Province</label>
          <select class="form-select"
            x-model="$store.search.stateCode"
            @change="$store.search.onStateChange()">
            <option value="">-- All states --</option>
            <template x-for="s in $store.search.states" :key="s.code">
              <option :value="s.code" x-text="s.name"></option>
            </template>
          </select>
        </div>

        <!-- City type-ahead (visible after country selected) -->
        <div class="form-group" x-show="$store.search.countryCode">
          <label>City</label>
          <div class="typeahead" @click.outside="$store.search.cityOpen = false">
            <input class="form-input" type="text" placeholder="Start typing a city name..."
              x-model="$store.search.cityQuery"
              @input="$store.search.searchCities($store.search.cityQuery)"
              @keydown="$store.search.cityKeydown($event)"
              @focus="if ($store.search.citySuggestions.length) $store.search.cityOpen = true">
            <div class="typeahead-dropdown" x-show="$store.search.cityOpen" x-transition>
              <template x-for="(city, idx) in $store.search.citySuggestions" :key="city.geoname_id">
                <div class="typeahead-item"
                  :class="{ highlighted: idx === $store.search.cityHighlight }"
                  @click="$store.search.selectCity(city)"
                  @mouseenter="$store.search.cityHighlight = idx">
                  <span class="name">
                    <span x-text="city.name"></span>
                    <span x-show="city.state_name" class="meta" x-text="', ' + city.state_name"></span>
                  </span>
                  <span class="meta" x-text="$store.search.formatPop(city.population)"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- POI Category -->
        <div class="form-group">
          <label>Type</label>
          <div class="radio-group">
            <template x-for="cat in $store.search.poiCategories" :key="cat.value">
              <label class="radio-pill" :class="{ active: $store.search.poiCategory === cat.value }">
                <input type="radio" name="poi-category"
                  :value="cat.value"
                  x-model="$store.search.poiCategory"
                  style="display:none">
                <span x-text="cat.label"></span>
              </label>
            </template>
          </div>
        </div>

        <!-- POI name type-ahead -->
        <div class="form-group">
          <label>Search by name</label>
          <div class="typeahead" @click.outside="$store.search.poiOpen = false">
            <input class="form-input" type="text" placeholder="Search for a place..."
              x-model="$store.search.poiQuery"
              @input="$store.search.searchPOIs($store.search.poiQuery)"
              @keydown.enter.prevent="$store.search.search()"
              @keydown="$store.search.poiKeydown($event)"
              @focus="if ($store.search.poiSuggestions.length) $store.search.poiOpen = true">
            <div class="typeahead-dropdown" x-show="$store.search.poiOpen" x-transition>
              <template x-for="(poi, idx) in $store.search.poiSuggestions" :key="poi.osm_id">
                <div class="typeahead-item"
                  :class="{ highlighted: idx === $store.search.poiHighlight }"
                  @click="$store.search.selectPOI(poi)"
                  @mouseenter="$store.search.poiHighlight = idx">
                  <span class="name">
                    <span class="icon" x-text="$store.search.poiTypeIcon(poi.poi_type)"></span>
                    <span x-text="poi.name"></span>
                  </span>
                  <span class="meta" x-show="poi.google_rating" x-text="'\u2B50 ' + poi.google_rating"></span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- Search button -->
        <button class="btn-search" @click="$store.search.search()"
          :disabled="$store.search.loading || (!$store.search.poiQuery && !$store.search.city && !$store.search.countryCode)">
          <span x-show="$store.search.loading" class="loading-spinner"></span>
          <span x-show="!$store.search.loading">Search</span>
        </button>
      </div>

      <!-- Results -->
      <div x-show="$store.search.searched">
        <div class="results-header">
          <h2 x-text="$store.search.resultTitle"></h2>
          <span class="count" x-text="$store.search.resultCount + ' results'"></span>
        </div>

        <div x-show="$store.search.results.length === 0 && !$store.search.loading" class="empty-state">
          <h3>No results found</h3>
          <p>Try adjusting your search criteria</p>
        </div>

        <div class="results-list">
          <template x-for="poi in $store.search.results" :key="poi.osm_id">
            <div class="result-card" @click="window.location.hash = '#/poi/' + poi.osm_id">
              <img x-show="poi.photo_url || (poi.google_photos && poi.google_photos[0])"
                :src="poi.photo_url || (poi.google_photos && poi.google_photos[0]?.url)"
                class="card-thumb" alt="">
              <div class="card-content">
                <div class="card-header">
                  <span class="card-title" x-text="poi.name || poi.osm_name || 'Unknown'"></span>
                  <span class="card-type" x-text="poi.poi_type"></span>
                </div>
                <div class="card-meta" x-show="poi.google_rating || poi.distance_km">
                  <span class="card-rating" x-show="poi.google_rating"
                    x-text="'\u2B50 ' + poi.google_rating + (poi.google_review_count ? ' (' + poi.google_review_count + ')' : '')"></span>
                  <span class="card-distance" x-show="poi.distance_km"
                    x-text="parseFloat(poi.distance_km).toFixed(1) + ' km'"></span>
                </div>
                <div class="card-address" x-show="poi.city || poi.country_code"
                  x-text="(poi.city || '') + (poi.country_code ? ', ' + poi.country_code : '')"></div>
                <div class="card-cuisine" x-show="poi.osm_cuisine" x-text="poi.osm_cuisine"></div>
              </div>
              <div class="card-actions" x-show="$store.auth.authenticated" @click.stop>
                <button class="btn-fav" :class="{ active: poi.is_favorite }"
                  @click="$store.search.toggleFavorite(poi)"
                  x-text="poi.is_favorite ? '\u2665' : '\u2661'"></button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- ─── POI DETAIL PAGE ─── -->
    <div x-show="$store.route.page === 'poi'">
      <a href="#/" class="btn-back">&larr; Back to search</a>
      <div class="poi-detail">
        <div class="poi-detail-actions" x-show="$store.auth.authenticated">
          <button class="btn-search" style="width:auto;padding:8px 16px;font-size:14px"
            x-data="{ fav: false, loading: true }"
            x-init="
              if ($store.auth.authenticated && $store.route.poiOsmId) {
                apiGet('/api/v1/poi/' + $store.route.poiOsmId).then(d => { fav = d.is_favorite; loading = false; }).catch(() => { loading = false; });
              } else { loading = false; }
            "
            @click="
              if (fav) { apiDelete('/api/v1/favorites/' + $store.route.poiOsmId).then(() => fav = false); }
              else { apiPost('/api/v1/favorites', { osm_id: parseInt($store.route.poiOsmId) }).then(() => fav = true); }
            "
            x-text="loading ? 'Loading...' : (fav ? 'Remove from Favorites' : 'Add to Favorites')">
          </button>
        </div>
        <iframe :src="'/preview/poi/' + $store.route.poiOsmId"
          style="width:100%;border:none;min-height:700px"
          @load="
            // Auto-resize iframe to content height
            try {
              const h = $el.contentDocument.documentElement.scrollHeight;
              if (h > 100) $el.style.height = h + 'px';
            } catch(e) {}
          "></iframe>
      </div>
    </div>

    <!-- ─── FAVORITES PAGE ─── -->
    <div x-show="$store.route.page === 'favorites'"
      x-data
      x-effect="if ($store.route.page === 'favorites' && $store.auth.authenticated) $store.favorites.load()">

      <template x-if="!$store.auth.authenticated && $store.auth.checked">
        <div class="empty-state">
          <h3>Login required</h3>
          <p>Please sign in to view your favorites.</p>
          <button class="btn-search" style="width:auto;margin-top:16px" @click="$store.auth.login()">Sign in with Google</button>
        </div>
      </template>

      <template x-if="$store.auth.authenticated">
        <div>
          <h2 style="margin-bottom:16px">My Favorites (<span x-text="$store.favorites.items.length"></span>)</h2>

          <div x-show="$store.favorites.loading" class="empty-state">
            <div class="loading-spinner"></div>
          </div>

          <div x-show="!$store.favorites.loading && $store.favorites.items.length === 0" class="empty-state">
            <h3>No favorites yet</h3>
            <p>Search for places and click the heart icon to save them.</p>
          </div>

          <div class="results-list" x-show="!$store.favorites.loading">
            <template x-for="fav in $store.favorites.items" :key="fav.osm_id || fav.poi_osm_id">
              <div class="result-card" @click="window.location.hash = '#/poi/' + (fav.osm_id || fav.poi_osm_id)">
                <div class="card-content">
                  <div class="card-header">
                    <span class="card-title" x-text="fav.name || fav.osm_name || 'Unknown'"></span>
                    <span class="card-type" x-text="fav.poi_type"></span>
                  </div>
                  <div class="card-meta" x-show="fav.google_rating">
                    <span class="card-rating" x-text="'\u2B50 ' + fav.google_rating"></span>
                  </div>
                  <div class="card-address" x-show="fav.city || fav.country_code"
                    x-text="(fav.city || '') + (fav.country_code ? ', ' + fav.country_code : '')"></div>
                </div>
                <div class="card-actions" @click.stop>
                  <button class="btn-fav active"
                    @click="$store.favorites.remove(fav.osm_id || fav.poi_osm_id)">&#x2665;</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

  </div>

  <!-- Import api functions for inline usage -->
  <script type="module">
    import { apiGet, apiPost, apiDelete } from '/js/api.js';
    window.apiGet = apiGet;
    window.apiPost = apiPost;
    window.apiDelete = apiDelete;
  </script>

</body>
</html>
