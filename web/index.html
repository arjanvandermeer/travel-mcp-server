<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dossier.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body x-data>
  <div class="app-shell">
    <header class="topbar">
      <nav class="nav-actions" aria-label="Primary">
        <button class="nav-link" :class="{ active: $store.route.page === 'home' }" @click="$store.route.goHome()">Pulse</button>
        <button class="nav-link" :class="{ active: $store.route.page === 'atlas' }" @click="$store.route.goAtlas()">Atlas</button>
        <button class="nav-link" :class="{ active: $store.route.page === 'composer' }" @click="$store.route.goComposer()">Composer</button>
        <template x-if="$store.auth.checked && !$store.auth.authenticated">
          <button class="primary-button compact" @click="$store.auth.login()">Sign in</button>
        </template>
        <template x-if="$store.auth.authenticated">
          <div class="account" x-data="{ open: false }" @click.outside="open = false">
            <button class="account-button" @click="open = !open">
              <img x-show="$store.auth.user?.picture_url" :src="$store.auth.user?.picture_url" alt="">
              <span x-text="$store.auth.user?.name || $store.auth.user?.email"></span>
            </button>
            <div class="account-menu" x-show="open" x-transition>
              <button @click="$store.route.goComposer(); open = false">Composer</button>
              <button @click="$store.auth.logout()">Logout</button>
            </div>
          </div>
        </template>
      </nav>
      <a class="build-chip" href="__APP_COMMIT_URL__" target="_blank" rel="noopener" title="View running build on GitHub">__APP_COMMIT__</a>
    </header>

    <main class="workspace" :class="'page-' + $store.route.page">
      <section class="city-pulse" x-show="$store.route.page === 'home'" x-cloak :style="$store.discovery.heroStyle()">
        <div class="pulse-panel">
          <div class="eyebrow" x-text="$store.discovery.eyebrow()"></div>
          <h1>
            <span x-text="$store.discovery.cityTitle()"></span>
          </h1>
        </div>
        <div class="hero-credit" x-show="$store.discovery.heroImageCredit" x-text="$store.discovery.heroImageCredit"></div>
      </section>

      <section class="home-feed" x-show="$store.route.page === 'home'" x-cloak>
        <div class="home-feed-inner">
          <div class="home-category-strip" role="group" aria-label="Place category filters">
            <template x-for="category in $store.discovery.feedCategories" :key="category.key">
              <button
                type="button"
                :aria-pressed="$store.discovery.isFeedActive(category.key)"
                :class="{ active: $store.discovery.isFeedActive(category.key) }"
                @click="$store.discovery.toggleFeed(category.key)">
                <span class="layer-dot" :style="'--dot:' + category.color"></span>
                <span x-text="category.label"></span>
                <small x-show="$store.discovery.isFeedActive(category.key)" x-text="$store.discovery.feedCount(category.key)"></small>
              </button>
            </template>
            <button
              type="button"
              class="feed-search-toggle"
              :class="{ active: $store.discovery.placeSearchOpen }"
              aria-label="Search selected categories by name"
              :aria-expanded="$store.discovery.placeSearchOpen"
              @click="$store.discovery.togglePlaceSearch()">
              ⌘
            </button>
          </div>
          <form class="feed-search-panel" x-show="$store.discovery.placeSearchOpen" x-transition @submit.prevent="$store.discovery.searchPlacesByName()">
            <div class="feed-search-row">
              <input
                id="place-name-search"
                class="command-input"
                type="search"
                placeholder="Name..."
                x-model="$store.discovery.placeSearchQuery">
              <button class="primary-button compact feed-search-submit" type="submit" :disabled="$store.discovery.placeSearchLoading">
                <span x-text="$store.discovery.placeSearchLoading ? 'Searching' : 'Search'"></span>
              </button>
            </div>
            <label class="option-toggle">
              <input type="checkbox" x-model="$store.discovery.placeOpenNow" @change="$store.discovery.refreshFeedForOptions()">
              <span>Open now</span>
            </label>
          </form>
          <p class="state-callout" x-show="$store.discovery.placeSearchError" x-text="$store.discovery.placeSearchError"></p>

          <template x-if="$store.discovery.loading && !$store.discovery.activeFeedItems().length">
            <div class="home-card-list">
              <div class="skeleton card"></div>
              <div class="skeleton card"></div>
              <div class="skeleton card"></div>
            </div>
          </template>

          <template x-if="!$store.discovery.loading && !$store.discovery.activeFeedItems().length">
            <div class="empty-panel wide">
              <h3 x-text="$store.discovery.activeFeedKeys.length ? 'No places surfaced yet' : 'No categories selected'"></h3>
              <p x-text="$store.discovery.activeFeedKeys.length ? 'Try another city, open the atlas, or expand the database import for this area.' : 'Turn on Stay, Eat, or See to show nearby cards.'"></p>
            </div>
          </template>

          <div class="home-card-list">
            <template x-for="poi in $store.discovery.activeFeedItems()" :key="poi.osm_id">
              <article class="place-card home-place-card" @click="$store.poi.open(poi.osm_id)">
                <div class="thumb" :style="$store.format.thumbStyle(poi)"></div>
                <div class="place-body">
                  <h3 x-text="poi.name || poi.osm_name"></h3>
                  <p x-text="$store.format.distance(poi)"></p>
                  <div class="place-actions" @click.stop>
                    <button title="Save" @click="$store.favorites.toggle(poi)" :class="{ active: poi.is_favorite }">♡</button>
                    <button title="Inspect" @click="$store.poi.open(poi.osm_id)">↗</button>
                  </div>
                </div>
              </article>
            </template>
          </div>

          <div class="feed-loading" x-show="$store.discovery.feedLoading">
            <div class="skeleton card"></div>
          </div>
          <button class="secondary-button load-more-button" x-show="$store.discovery.canLoadMore()" @click="$store.discovery.loadMoreFeed()">Load more</button>
        </div>
      </section>

      <section class="atlas" x-show="$store.route.page === 'atlas'" x-cloak>
        <div class="map-stage">
          <div id="map"></div>
          <button class="locate-button" @click="$store.atlas.locate()">⌖</button>
          <div class="map-preview" x-show="$store.atlas.selected" x-transition>
            <button class="close-button" @click="$store.atlas.selected = null">×</button>
            <h3 x-text="$store.atlas.selected?.name || $store.atlas.selected?.osm_name"></h3>
            <p x-text="$store.format.placeMeta($store.atlas.selected || {})"></p>
            <div>
              <button class="primary-button compact" @click="$store.poi.open($store.atlas.selected.osm_id)">Dossier</button>
            </div>
          </div>
        </div>
        <aside class="atlas-rail">
          <div class="rail-section">
            <div class="eyebrow">DISCOVER</div>
            <h2 x-text="$store.atlas.title()"></h2>
            <p x-text="$store.atlas.contextLine()"></p>
          </div>
          <div class="home-category-strip atlas-category-strip" role="group" aria-label="Map place category filters">
            <template x-for="layer in $store.atlas.layers" :key="layer.key">
              <button type="button" :aria-pressed="$store.atlas.activeLayers.has(layer.key)" :class="{ active: $store.atlas.activeLayers.has(layer.key) }" @click="$store.atlas.toggleLayer(layer.key)">
                <span class="layer-dot" :style="'--dot:' + layer.color"></span>
                <span x-text="layer.label"></span>
                <small x-show="$store.atlas.activeLayers.has(layer.key)" x-text="$store.atlas.feedCount(layer.key)"></small>
              </button>
            </template>
            <button
              type="button"
              class="feed-search-toggle"
              :class="{ active: $store.atlas.searchOpen }"
              aria-label="Search map places by name"
              :aria-expanded="$store.atlas.searchOpen"
              @click="$store.atlas.toggleSearch()">
              ⌘
            </button>
          </div>
          <form class="feed-search-panel atlas-search-panel" x-show="$store.atlas.searchOpen" x-transition @submit.prevent="$store.atlas.textSearch($store.search.query)">
            <input id="command-search" class="command-input" type="search" placeholder="Name..."
              x-model="$store.search.query"
              @input="$store.search.autocomplete()"
              @keydown="$store.search.onKeydown($event)"
              @focus="$store.search.open = $store.search.suggestions.length > 0">
            <button class="primary-button" type="submit">Search</button>
            <div class="suggestions" x-show="$store.search.open" x-transition @click.outside="$store.search.open = false">
              <template x-for="(item, index) in $store.search.suggestions" :key="item.osm_id">
                <button class="suggestion" type="button" :class="{ active: index === $store.search.highlight }" @click="$store.search.select(item)">
                  <span class="suggestion-name" x-text="item.name"></span>
                  <span class="suggestion-meta" x-text="$store.format.placeMeta(item)"></span>
                </button>
              </template>
            </div>
          </form>
          <div class="rail-scroll">
            <template x-if="$store.atlas.loading">
              <div class="skeleton-stack"><div class="skeleton card"></div><div class="skeleton card"></div><div class="skeleton card"></div></div>
            </template>
            <template x-if="!$store.atlas.loading && $store.atlas.places.length === 0">
              <div class="empty-panel">
                <h3>No places in view</h3>
                <p>Move the map, enable more layers, or search for a stronger starting point.</p>
              </div>
            </template>
            <template x-for="poi in $store.atlas.places" :key="poi.osm_id">
              <article class="place-card" :class="{ selected: $store.atlas.selected?.osm_id === poi.osm_id }" @mouseenter="$store.atlas.preview(poi)" @click="$store.atlas.select(poi)">
                <span class="result-rank" x-show="poi.atlas_rank" x-text="poi.atlas_rank"></span>
                <div class="thumb" :style="$store.format.thumbStyle(poi)"></div>
                <div class="place-body">
                  <h3><button type="button" @click.stop="$store.poi.open(poi.osm_id)" x-text="poi.name || poi.osm_name"></button></h3>
                  <p x-text="$store.format.placeMeta(poi)"></p>
                  <div class="place-actions" @click.stop>
                    <button title="Save" @click="$store.favorites.toggle(poi)" :class="{ active: poi.is_favorite }">♡</button>
                    <button title="Inspect" @click="$store.poi.open(poi.osm_id)">↗</button>
                  </div>
                </div>
              </article>
            </template>
          </div>
        </aside>
      </section>

      <section class="dossier" x-show="$store.route.page === 'poi'" x-cloak>
        <button class="back-button" @click="$store.route.goAtlas()">← Back to map</button>
        <template x-if="$store.poi.loading">
          <div class="skeleton-stack dossier-shell"><div class="skeleton block"></div><div class="skeleton block"></div></div>
        </template>
        <template x-if="!$store.poi.loading && $store.poi.current">
          <article class="dossier-shell">
            <div class="dossier-hero" :style="$store.format.heroStyle($store.poi.current)">
              <div class="dossier-hero-copy">
                <div class="eyebrow" x-text="($store.poi.current.google_primary_type_display || $store.poi.current.poi_type || 'Property')"></div>
                <h1 x-text="$store.poi.current.name || $store.poi.current.osm_name"></h1>
                <p x-text="$store.format.bestAddress($store.poi.current) || $store.format.placeMeta($store.poi.current)"></p>
                <div class="hero-pills">
                  <div class="open-compact hero-open-status" :class="$store.format.openStatusClass($store.poi.current)">
                    <span x-text="$store.format.openStatus($store.poi.current)"></span>
                    <small x-show="$store.format.hoursDetail($store.poi.current)" x-text="$store.format.hoursDetail($store.poi.current)"></small>
                  </div>
                  <span x-show="$store.format.priceLabel($store.poi.current)" class="price-pill" x-text="$store.format.priceLabel($store.poi.current)"></span>
                  <span x-show="$store.poi.current.google_rating"><strong x-text="Number($store.poi.current.google_rating).toFixed(1)"></strong> ★</span>
                  <span x-show="$store.poi.current.google_review_count" x-text="$store.poi.current.google_review_count + ' reviews'"></span>
                </div>
              </div>
              <div class="hero-actions">
                <button
                  type="button"
                  class="hero-icon-button"
                  :class="{ active: $store.poi.current.is_favorite }"
                  :aria-label="$store.poi.current.is_favorite ? 'Remove saved place' : 'Save place'"
                  :title="$store.poi.current.is_favorite ? 'Saved' : 'Save'"
                  @click="$store.favorites.toggle($store.poi.current)">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8L12 3.6z"/></svg>
                </button>
                <a class="hero-icon-button" :href="$store.poi.mapsUrl()" target="_blank" rel="noopener" aria-label="Open in Maps" title="Maps">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.3 7-11.6A7 7 0 0 0 5 9.4C5 15.7 12 21 12 21z"/><circle cx="12" cy="9.4" r="2.4"/></svg>
                </a>
                <a class="hero-icon-button" x-show="$store.poi.websiteUrl()" :href="$store.poi.websiteUrl()" target="_blank" rel="noopener" aria-label="Open website" title="Website">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2 2.2 3 5 3 8.5s-1 6.3-3 8.5c-2-2.2-3-5-3-8.5s1-6.3 3-8.5z"/></svg>
                </a>
                <a class="hero-icon-button" x-show="$store.poi.phoneUrl()" :href="$store.poi.phoneUrl()" aria-label="Call" title="Call">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5l2.6 4.7-1.8 1.4c1.1 2.3 2.9 4.1 5.2 5.2l1.4-1.8 4.7 2.6-.8 3.1c-.2.7-.8 1.1-1.5 1-7.4-.8-13.3-6.7-14.1-14.1-.1-.7.3-1.3 1-1.5L7 4.5z"/></svg>
                </a>
              </div>
            </div>
            <div class="media-carousel" x-show="$store.format.detailPhotos($store.poi.current).length">
              <button class="carousel-arrow left" type="button" aria-label="Previous photos" @click="$refs.poiPhotoStrip.scrollBy({ left: -320, behavior: 'smooth' })">‹</button>
              <div class="photo-strip" x-ref="poiPhotoStrip">
                <template x-for="photo in $store.format.detailPhotos($store.poi.current)" :key="photo">
                  <img class="photo-tile" :src="photo" alt="" loading="lazy">
                </template>
              </div>
              <button class="carousel-arrow right" type="button" aria-label="Next photos" @click="$refs.poiPhotoStrip.scrollBy({ left: 320, behavior: 'smooth' })">›</button>
              <div class="carousel-dots" aria-hidden="true">
                <template x-for="photo in $store.format.detailPhotos($store.poi.current)" :key="'dot-' + photo">
                  <span></span>
                </template>
              </div>
            </div>
            <div class="dossier-grid">
              <section class="dossier-main">
                <div class="copy-block">
                  <div class="place-contact-box" x-show="$store.format.bestAddress($store.poi.current) || $store.poi.phoneNumber() || $store.poi.websiteUrl()">
                    <h2 x-text="$store.poi.current.name || $store.poi.current.osm_name || 'Place details'"></h2>
                    <div class="place-contact-rows">
                      <a class="place-contact-row" x-show="$store.format.bestAddress($store.poi.current)" :href="$store.poi.mapsUrl()" target="_blank" rel="noopener">
                        <span>Address</span>
                        <strong x-text="$store.format.bestAddress($store.poi.current)"></strong>
                      </a>
                      <a class="place-contact-row" x-show="$store.poi.phoneNumber()" :href="$store.poi.phoneUrl()">
                        <span>Phone</span>
                        <strong x-text="$store.poi.phoneNumber()"></strong>
                      </a>
                    </div>
                    <a class="place-website-box" x-show="$store.poi.websiteUrl()" :href="$store.poi.websiteUrl()" target="_blank" rel="noopener">
                      <span>Website</span>
                      <strong x-text="$store.poi.websiteUrl()"></strong>
                    </a>
                  </div>
                  <div class="review-section" x-show="$store.format.reviewCards($store.poi.current).length">
                    <div class="section-heading">
                      <span>Reviews</span>
                      <strong x-text="$store.format.reviewCards($store.poi.current).length + ' shown'"></strong>
                    </div>
                    <div class="review-carousel-shell">
                      <button class="carousel-arrow left" type="button" aria-label="Previous reviews" @click="$refs.poiReviewStrip.scrollBy({ left: -280, behavior: 'smooth' })">‹</button>
                      <div class="review-strip" x-ref="poiReviewStrip">
                        <template x-for="review in $store.format.reviewCards($store.poi.current)" :key="review.author + review.text">
                          <article class="review-card">
                            <div class="review-card-top">
                              <strong x-text="review.author"></strong>
                              <span x-text="review.ratingStars"></span>
                            </div>
                            <p x-text="review.text"></p>
                            <small x-show="review.relativeTime" x-text="review.relativeTime"></small>
                          </article>
                        </template>
                      </div>
                      <button class="carousel-arrow right" type="button" aria-label="Next reviews" @click="$refs.poiReviewStrip.scrollBy({ left: 280, behavior: 'smooth' })">›</button>
                    </div>
                    <div class="carousel-dots" aria-hidden="true">
                      <template x-for="review in $store.format.reviewCards($store.poi.current)" :key="'review-dot-' + review.author + review.text">
                        <span></span>
                      </template>
                    </div>
                  </div>
                  <div class="inline-loading" x-show="$store.poi.isEnriching()" aria-live="polite">
                    <span class="tiny-spinner" aria-hidden="true"></span>
                    <span>Refreshing place details</span>
                  </div>
                </div>
              </section>
              <aside class="composer-panel">
                <div class="panel-kicker">Planning</div>
                <h2>Trip Composer</h2>
                <p x-show="!$store.poi.current.is_favorite">Save this place to keep private notes for planning.</p>
                <button
                  type="button"
                  class="favorite-date-button"
                  x-show="$store.poi.current.is_favorite"
                  @click="$store.poi.editNote(); $nextTick(() => $refs.tripComposerNote?.focus())">
                  <span>Bookmarked</span>
                  <strong x-text="$store.poi.favoriteSinceLabel() || 'Saved'"></strong>
                </button>
                <textarea
                  x-ref="tripComposerNote"
                  :class="{ readonly: $store.poi.current.is_favorite && !$store.poi.noteEditing }"
                  :placeholder="$store.poi.notePlaceholder()"
                  :readonly="$store.poi.current.is_favorite && !$store.poi.noteEditing"
                  x-model="$store.poi.note"
                  @click="$store.poi.editNote()"
                  @blur="$store.poi.finishNoteEdit()"></textarea>
                <div class="composer-actions">
                  <button class="primary-button" @click="$store.poi.toggleFavorite()" x-text="$store.poi.current.is_favorite ? 'Saved' : 'Save'"></button>
                </div>
              </aside>
            </div>
            <div class="dossier-data-footer">
              <button class="secondary-button compact" @click="$store.poi.dataOpen = true">Data</button>
            </div>
            <div class="data-modal-backdrop" x-show="$store.poi.dataOpen" x-transition @click.self="$store.poi.dataOpen = false">
              <section class="data-modal" role="dialog" aria-modal="true" aria-label="Raw place data">
                <div class="data-modal-header">
                  <h2>Raw place data</h2>
                  <button class="close-button" @click="$store.poi.dataOpen = false">×</button>
                </div>
                <pre class="data-pane" x-text="$store.poi.rawJson()"></pre>
              </section>
            </div>
          </article>
        </template>
      </section>

      <section class="composer-page" x-show="$store.route.page === 'composer'" x-cloak x-effect="if ($store.route.page === 'composer') $store.favorites.load()">
        <div class="composer-header">
          <div>
            <div class="eyebrow">Saved planning</div>
            <h1>Trip Composer</h1>
          </div>
          <button class="primary-button compact" @click="$store.route.goAtlas()">Add places</button>
        </div>
        <template x-if="!$store.auth.authenticated && $store.auth.checked">
          <div class="empty-panel wide"><h3>Sign in to compose a trip</h3><p>Your saved places and notes live here.</p><button class="primary-button compact" @click="$store.auth.login()">Sign in</button></div>
        </template>
        <template x-if="$store.auth.authenticated">
          <div class="empty-panel wide" x-show="!$store.favorites.loading && $store.favorites.items.length === 0">
            <h3>No saved places yet</h3>
            <p>Add places from Atlas or a place detail page to compose a trip.</p>
          </div>
          <div class="board" x-show="$store.favorites.items.length > 0">
            <template x-for="column in $store.favorites.columns()" :key="column.key">
              <section class="board-column">
                <h2 x-text="column.label"></h2>
                <p class="board-column-summary" x-text="column.subtitle"></p>
                <template x-for="fav in column.items" :key="fav.osm_id || fav.poi_osm_id">
                  <article class="board-card" @click="$store.poi.open(fav.osm_id || fav.poi_osm_id)">
                    <strong x-text="fav.name || fav.osm_name || 'Unknown place'"></strong>
                    <small x-text="$store.favorites.itemMeta(fav)"></small>
                    <textarea placeholder="Add a note" x-model="fav.favorite_notes" @click.stop @change.stop="$store.favorites.saveNote(fav, fav.favorite_notes)"></textarea>
                  </article>
                </template>
              </section>
            </template>
          </div>
        </template>
      </section>
    </main>
  </div>
</body>
</html>
