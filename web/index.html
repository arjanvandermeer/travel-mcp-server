<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dossier.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body x-data>
  <div class="app-shell">
    <header class="topbar">
      <a href="/" class="brand" @click.prevent="$store.route.goHome()">
        <span class="brand-mark">A</span>
        <span>Travel</span>
      </a>
      <a class="build-chip" href="__APP_COMMIT_URL__" target="_blank" rel="noopener" title="View running build on GitHub">Build __APP_COMMIT__</a>
      <nav class="nav-actions" aria-label="Primary">
        <button class="icon-button" title="Command search" @click="$store.ui.focusCommand()">⌘</button>
        <button class="nav-link" :class="{ active: $store.route.page === 'home' }" @click="$store.route.goHome()">City Pulse</button>
        <button class="nav-link" :class="{ active: $store.route.page === 'atlas' }" @click="$store.route.goAtlas()">Atlas</button>
        <button class="nav-link" :class="{ active: $store.route.page === 'composer' }" @click="$store.route.goComposer()">Trip Composer</button>
        <template x-if="$store.auth.checked && !$store.auth.authenticated">
          <button class="primary-button compact" @click="$store.auth.login()">Sign in</button>
        </template>
        <template x-if="$store.auth.authenticated">
          <div class="account" x-data="{ open: false }" @click.outside="open = false">
            <button class="account-button" @click="open = !open">
              <img x-show="$store.auth.user?.picture_url" :src="$store.auth.user?.picture_url" alt="">
              <span x-text="$store.auth.user?.name || $store.auth.user?.email"></span>
            </button>
            <div class="account-menu" x-show="open" x-transition>
              <button @click="$store.route.goComposer(); open = false">Trip Composer</button>
              <button @click="$store.auth.logout()">Logout</button>
            </div>
          </div>
        </template>
      </nav>
    </header>

    <main class="workspace" :class="'page-' + $store.route.page">
      <section class="city-pulse" x-show="$store.route.page === 'home'" x-cloak :style="$store.discovery.heroStyle()">
        <div class="pulse-panel">
          <div class="eyebrow" x-text="$store.discovery.eyebrow()"></div>
          <h1>
            <span x-text="$store.discovery.cityTitle()"></span>
          </h1>
          <p x-text="$store.discovery.subtitle()"></p>
          <div class="command-wrap">
            <input id="command-search" class="command-input" type="search" placeholder="Search a city, hotel, restaurant, or landmark"
              x-model="$store.search.query"
              @input="$store.search.autocomplete()"
              @keydown="$store.search.onKeydown($event)"
              @focus="$store.search.open = $store.search.suggestions.length > 0">
            <button class="primary-button" @click="$store.search.commit()">Explore</button>
            <div class="suggestions" x-show="$store.search.open" x-transition @click.outside="$store.search.open = false">
              <template x-for="(item, index) in $store.search.suggestions" :key="item.osm_id">
                <button class="suggestion" :class="{ active: index === $store.search.highlight }" @click="$store.search.select(item)">
                  <span class="suggestion-name" x-text="item.name"></span>
                  <span class="suggestion-meta" x-text="$store.format.placeMeta(item)"></span>
                </button>
              </template>
            </div>
          </div>
          <div class="pulse-actions">
            <button class="secondary-button" @click="$store.discovery.useLocation()">Use my location</button>
            <button class="secondary-button" @click="$store.discovery.loadRandomCity()">Random city</button>
            <button class="secondary-button" @click="$store.discovery.openAtlas()">Open map</button>
          </div>
        </div>
      </section>

      <section class="home-feed" x-show="$store.route.page === 'home'" x-cloak>
        <div class="home-feed-inner">
          <div class="feed-head">
            <div>
              <div class="eyebrow">Closest Places</div>
              <h2 x-text="$store.discovery.feedTitle()"></h2>
              <p x-text="$store.discovery.feedSubtitle()"></p>
            </div>
            <div class="data-status-grid compact-status">
              <template x-for="item in $store.discovery.statusItems()" :key="item.label">
                <div>
                  <span x-text="item.label"></span>
                  <strong x-text="item.value"></strong>
                </div>
              </template>
            </div>
          </div>

          <div class="home-category-strip" role="tablist" aria-label="Place category">
            <template x-for="category in $store.discovery.feedCategories" :key="category.key">
              <button
                role="tab"
                :aria-selected="$store.discovery.activeFeed === category.key"
                :class="{ active: $store.discovery.activeFeed === category.key }"
                @click="$store.discovery.selectFeed(category.key)">
                <span class="layer-dot" :style="'--dot:' + category.color"></span>
                <span x-text="category.label"></span>
                <small x-text="$store.discovery.feedCount(category.key)"></small>
              </button>
            </template>
          </div>

          <template x-if="$store.discovery.loading && !$store.discovery.activeFeedItems().length">
            <div class="home-card-list">
              <div class="skeleton card"></div>
              <div class="skeleton card"></div>
              <div class="skeleton card"></div>
            </div>
          </template>

          <template x-if="!$store.discovery.loading && !$store.discovery.activeFeedItems().length">
            <div class="empty-panel wide">
              <h3>No places surfaced yet</h3>
              <p>Try another city, open the atlas, or expand the database import for this area.</p>
            </div>
          </template>

          <div class="home-card-list">
            <template x-for="poi in $store.discovery.activeFeedItems()" :key="poi.osm_id">
              <article class="place-card home-place-card" @click="$store.poi.open(poi.osm_id)">
                <div class="thumb" :style="$store.format.thumbStyle(poi)"></div>
                <div class="place-body">
                  <h3 x-text="poi.name || poi.osm_name"></h3>
                  <p x-text="$store.format.distance(poi)"></p>
                  <div class="place-actions" @click.stop>
                    <button title="Save" @click="$store.favorites.toggle(poi)" :class="{ active: poi.is_favorite }">♡</button>
                    <button title="Inspect" @click="$store.poi.open(poi.osm_id)">↗</button>
                  </div>
                </div>
              </article>
            </template>
          </div>

          <div class="feed-loading" x-show="$store.discovery.feedLoading">
            <div class="skeleton card"></div>
          </div>
          <button class="secondary-button load-more-button" x-show="$store.discovery.canLoadMore()" @click="$store.discovery.loadMoreFeed()">Load more</button>
        </div>
      </section>

      <section class="atlas" x-show="$store.route.page === 'atlas'" x-cloak>
        <aside class="atlas-rail">
          <div class="rail-section">
            <div class="eyebrow">Travel</div>
            <h2 x-text="$store.atlas.title()"></h2>
            <p x-text="$store.atlas.contextLine()"></p>
            <div class="atlas-status-grid">
              <div>
                <span>Results</span>
                <strong x-text="$store.atlas.resultsLabel()"></strong>
              </div>
              <div>
                <span>Layers</span>
                <strong x-text="$store.atlas.layerCountLabel()"></strong>
              </div>
              <button class="secondary-button compact" @click="$store.atlas.resetView()">Reset</button>
            </div>
          </div>
          <div class="command-wrap rail-command">
            <input class="command-input" type="search" placeholder="Search inside the atlas"
              x-model="$store.search.query"
              @input="$store.search.autocomplete()"
              @keydown="$store.search.onKeydown($event)"
              @focus="$store.search.open = $store.search.suggestions.length > 0">
            <div class="suggestions" x-show="$store.search.open" x-transition @click.outside="$store.search.open = false">
              <template x-for="(item, index) in $store.search.suggestions" :key="item.osm_id">
                <button class="suggestion" :class="{ active: index === $store.search.highlight }" @click="$store.search.select(item)">
                  <span class="suggestion-name" x-text="item.name"></span>
                  <span class="suggestion-meta" x-text="$store.format.placeMeta(item)"></span>
                </button>
              </template>
            </div>
          </div>
          <div class="layer-grid">
            <template x-for="layer in $store.atlas.layers" :key="layer.key">
              <button class="layer-toggle" :class="{ active: $store.atlas.activeLayers.has(layer.key) }" @click="$store.atlas.toggleLayer(layer.key)">
                <span class="layer-dot" :style="'--dot:' + layer.color"></span>
                <span x-text="layer.label"></span>
              </button>
            </template>
          </div>
          <div class="rail-scroll">
            <template x-if="$store.atlas.loading">
              <div class="skeleton-stack"><div class="skeleton card"></div><div class="skeleton card"></div><div class="skeleton card"></div></div>
            </template>
            <template x-if="!$store.atlas.loading && $store.atlas.places.length === 0">
              <div class="empty-panel">
                <h3>No places in view</h3>
                <p>Move the map, enable more layers, or search for a stronger starting point.</p>
              </div>
            </template>
            <template x-for="poi in $store.atlas.places" :key="poi.osm_id">
              <article class="place-card" :class="{ selected: $store.atlas.selected?.osm_id === poi.osm_id }" @mouseenter="$store.atlas.preview(poi)" @click="$store.atlas.select(poi)">
                <div class="thumb" :style="$store.format.thumbStyle(poi)"></div>
                <div class="place-body">
                  <h3 x-text="poi.name || poi.osm_name"></h3>
                  <p x-text="$store.format.placeMeta(poi)"></p>
                  <div class="place-actions" @click.stop>
                    <button title="Save" @click="$store.favorites.toggle(poi)" :class="{ active: poi.is_favorite }">♡</button>
                    <button title="Inspect" @click="$store.poi.open(poi.osm_id)">↗</button>
                  </div>
                </div>
              </article>
            </template>
          </div>
        </aside>
        <div class="map-stage">
          <div id="map"></div>
          <button class="locate-button" @click="$store.atlas.locate()">⌖</button>
          <div class="map-preview" x-show="$store.atlas.selected" x-transition>
            <button class="close-button" @click="$store.atlas.selected = null">×</button>
            <h3 x-text="$store.atlas.selected?.name || $store.atlas.selected?.osm_name"></h3>
            <p x-text="$store.format.placeMeta($store.atlas.selected || {})"></p>
            <div>
              <button class="primary-button compact" @click="$store.poi.open($store.atlas.selected.osm_id)">Dossier</button>
            </div>
          </div>
        </div>
      </section>

      <section class="dossier" x-show="$store.route.page === 'poi'" x-cloak>
        <button class="back-button" @click="$store.route.goAtlas()">← Back to map</button>
        <template x-if="$store.poi.loading">
          <div class="skeleton-stack dossier-shell"><div class="skeleton block"></div><div class="skeleton block"></div></div>
        </template>
        <template x-if="!$store.poi.loading && $store.poi.current">
          <article class="dossier-shell">
            <div class="dossier-hero" :style="$store.format.heroStyle($store.poi.current)">
              <div class="dossier-hero-copy">
                <div class="eyebrow" x-text="($store.poi.current.google_primary_type_display || $store.poi.current.poi_type || 'Property')"></div>
                <h1 x-text="$store.poi.current.name || $store.poi.current.osm_name"></h1>
                <p x-text="$store.format.bestAddress($store.poi.current) || $store.format.placeMeta($store.poi.current)"></p>
                <div class="hero-pills">
                  <span x-show="$store.poi.current.google_rating"><strong x-text="Number($store.poi.current.google_rating).toFixed(1)"></strong> rating</span>
                  <span x-show="$store.poi.current.google_review_count" x-text="$store.poi.current.google_review_count + ' reviews'"></span>
                  <span x-show="$store.poi.current.osm_stars" x-text="$store.poi.current.osm_stars + ' stars'"></span>
                  <span x-show="$store.format.priceLabel($store.poi.current)" x-text="$store.format.priceLabel($store.poi.current)"></span>
                </div>
              </div>
              <div class="hero-actions">
                <button class="primary-button compact" @click="$store.favorites.toggle($store.poi.current)" x-text="$store.poi.current.is_favorite ? 'Saved' : 'Save'"></button>
                <a class="secondary-button compact" :href="$store.poi.mapsUrl()" target="_blank">Maps</a>
              </div>
            </div>
            <div class="photo-strip" x-show="$store.format.detailPhotos($store.poi.current).length">
              <template x-for="photo in $store.format.detailPhotos($store.poi.current)" :key="photo">
                <div class="photo-tile" :style="'background-image:url(&quot;' + photo + '&quot;)'"></div>
              </template>
            </div>
            <div class="dossier-grid">
              <section class="dossier-main">
                <div class="property-facts">
                  <template x-for="fact in $store.format.propertyFacts($store.poi.current)" :key="fact.label">
                    <div>
                      <span x-text="fact.label"></span>
                      <strong x-text="fact.value"></strong>
                    </div>
                  </template>
                </div>
                <div class="copy-block">
                  <p x-text="$store.poi.summary()"></p>
                  <div class="inline-loading" x-show="$store.poi.isEnriching()" aria-live="polite">
                    <span class="tiny-spinner" aria-hidden="true"></span>
                    <span>Refreshing place details</span>
                  </div>
                  <div class="detail-list">
                    <div>
                      <span>Address</span>
                      <strong x-text="$store.format.bestAddress($store.poi.current) || 'Not listed'"></strong>
                    </div>
                    <div>
                      <span>Hours</span>
                      <strong x-text="$store.format.openStatus($store.poi.current)"></strong>
                    </div>
                    <div>
                      <span>Phone</span>
                      <strong x-text="$store.format.bestPhone($store.poi.current) || 'Not listed'"></strong>
                    </div>
                  </div>
                  <div class="action-grid">
                    <a :href="$store.format.bestWebsite($store.poi.current)" x-show="$store.format.bestWebsite($store.poi.current)" target="_blank">Website</a>
                    <a :href="$store.poi.mapsUrl()" target="_blank">Maps</a>
                    <a :href="'tel:' + $store.format.bestPhone($store.poi.current)" x-show="$store.format.bestPhone($store.poi.current)">Call</a>
                  </div>
                </div>
              </section>
              <aside class="composer-panel">
                <div class="panel-kicker">Planning</div>
                <h2>Trip Composer</h2>
                <p>Save private notes and keep this place handy for planning.</p>
                <textarea placeholder="Notes for this place" x-model="$store.poi.note" @change="$store.favorites.saveNote($store.poi.current, $store.poi.note)"></textarea>
                <div class="composer-actions">
                  <button class="primary-button" @click="$store.favorites.toggle($store.poi.current)" x-text="$store.poi.current.is_favorite ? 'Saved' : 'Save'"></button>
                </div>
              </aside>
            </div>
          </article>
        </template>
      </section>

      <section class="composer-page" x-show="$store.route.page === 'composer'" x-cloak x-effect="if ($store.route.page === 'composer') $store.favorites.load()">
        <div class="composer-header">
          <div>
            <div class="eyebrow">Saved planning</div>
            <h1>Trip Composer</h1>
          </div>
          <button class="primary-button compact" @click="$store.route.goAtlas()">Add places</button>
        </div>
        <template x-if="!$store.auth.authenticated && $store.auth.checked">
          <div class="empty-panel wide"><h3>Sign in to compose a trip</h3><p>Your saved places, notes, and comparisons live here.</p><button class="primary-button compact" @click="$store.auth.login()">Sign in</button></div>
        </template>
        <template x-if="$store.auth.authenticated">
          <div class="board">
            <template x-for="column in $store.favorites.columns()" :key="column.key">
              <section class="board-column">
                <h2 x-text="column.label"></h2>
                <template x-for="fav in column.items" :key="fav.osm_id || fav.poi_osm_id">
                  <article class="board-card" @click="$store.poi.open(fav.osm_id || fav.poi_osm_id)">
                    <strong x-text="fav.name || fav.osm_name || 'Unknown place'"></strong>
                    <small x-text="$store.format.placeMeta(fav)"></small>
                    <textarea placeholder="Add a note" x-model="fav.favorite_notes" @click.stop @change.stop="$store.favorites.saveNote(fav, fav.favorite_notes)"></textarea>
                  </article>
                </template>
              </section>
            </template>
          </div>
        </template>
      </section>
    </main>
  </div>
</body>
</html>
