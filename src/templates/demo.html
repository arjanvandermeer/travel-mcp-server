<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POI Template Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .demo-header h1 { margin: 0 0 10px 0; color: #333; }
    .demo-header p { color: #666; margin: 0; }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .demo-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .demo-card-label {
      background: #333;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .poi-container {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>POI Details Template Demo</h1>
    <p>Client-side Handlebars rendering with hardcoded POI data</p>
  </div>

  <div class="demo-grid">
    <div class="demo-card">
      <div class="demo-card-label">Restaurant Example: Coco51</div>
      <div id="coco51-container" class="poi-container"></div>
    </div>

    <div class="demo-card">
      <div class="demo-card-label">Hotel Example: Waldorf Astoria Bangkok</div>
      <div id="waldorf-container" class="poi-container"></div>
    </div>
  </div>

  <!-- POI Details Template (same as poi-details.hbs) -->
  <script id="poi-template" type="text/x-handlebars-template">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      .poi-card {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        color: #333;
        line-height: 1.5;
      }
      .hero-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px;
      }
      .header h1 { font-size: 24px; margin-bottom: 8px; }
      .header .type { opacity: 0.8; font-size: 14px; text-transform: capitalize; }
      .header .rating { margin-top: 12px; font-size: 18px; }
      .content { padding: 20px; }
      .card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .card h2 { font-size: 14px; color: #666; margin-bottom: 8px; }
      .card p { font-size: 16px; }
      .card a { color: #667eea; text-decoration: none; }
      .address-line { display: block; }
      .phone { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
      .hours-list { list-style: none; font-size: 14px; }
      .hours-list li { padding: 4px 0; border-bottom: 1px solid #eee; }
      .hours-list li:last-child { border-bottom: none; }
      .map-link {
        display: block;
        background: #667eea;
        color: white;
        text-align: center;
        padding: 14px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .map-link:hover { background: #5a6fd6; }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; }
      .tag {
        background: #f0f0f0;
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 14px;
        text-transform: capitalize;
      }
    </style>
    <div class="poi-card">
      {{#if photo_url}}
      <img class="hero-image" src="{{photo_url}}" alt="{{poiName}}">
      {{/if}}

      <div class="header">
        <div class="type">{{poi_type}}</div>
        <h1>{{poiName}}</h1>
        {{#if google_rating}}
        <div class="rating">
          ⭐ {{google_rating}}
          {{#if google_review_count}}
          ({{google_review_count}} reviews)
          {{/if}}
        </div>
        {{/if}}
      </div>

      <div class="content">
        {{#if address_lines}}
        <div class="card">
          <h2>Address</h2>
          {{#each address_lines}}
          <span class="address-line">{{this}}</span>
          {{/each}}
          {{#if google_phone}}
          <p class="phone"><a href="tel:{{google_phone}}">{{google_phone}}</a></p>
          {{/if}}
        </div>
        {{/if}}

        {{#if is_food}}
        {{#if cuisine_list}}
        <div class="card">
          <h2>Cuisine</h2>
          <div class="tags">
            {{#each cuisine_list}}
            <span class="tag">{{this}}</span>
            {{/each}}
          </div>
        </div>
        {{/if}}
        {{/if}}

        {{#if google_website}}
        <div class="card">
          <h2>Website</h2>
          <p><a href="{{google_website}}" target="_blank">{{google_website}}</a></p>
        </div>
        {{/if}}

        {{#if opening_hours}}
        <div class="card">
          <h2>Opening Hours</h2>
          <ul class="hours-list">
            {{#each opening_hours}}
            <li>{{this}}</li>
            {{/each}}
          </ul>
        </div>
        {{/if}}

        <a class="map-link" href="{{mapsUrl}}" target="_blank">
          Open in Google Maps
        </a>
      </div>
    </div>
  </script>

  <script>
    // Hardcoded POI data from database (with photo URLs)
    const coco51 = {
      osm_id: 2528330186,
      poi_type: "restaurant",
      osm_name: "coco 51",
      osm_latitude: 12.5795989,
      osm_longitude: 99.9568045,
      google_place_id: "ChIJk-KM81Gq_TARJhcITrk0Pxs",
      google_display_name: {text: "Coco51 Restaurant & Bar", languageCode: "en"},
      google_address: "Soi Damrong Rat, Tambon Hua Hin, Amphoe Hua Hin, Chang Wat Prachuap Khiri Khan 77110, Thailand",
      google_phone: "080 006 1944",
      google_rating: 4.3,
      google_review_count: 847,
      google_opening_hours: {
        weekdayDescriptions: [
          "Monday: 12:30 – 10:00 PM",
          "Tuesday: 12:30 – 10:00 PM",
          "Wednesday: 12:30 – 10:00 PM",
          "Thursday: 12:30 – 10:00 PM",
          "Friday: 12:30 – 10:00 PM",
          "Saturday: 12:30 – 10:00 PM",
          "Sunday: 12:30 – 10:00 PM"
        ]
      },
      google_photos: [{
        url: "https://places.googleapis.com/v1/places/ChIJk-KM81Gq_TARJhcITrk0Pxs/photos/AcnlKN0B90uC_NSe8Uy_gOeydZQFZCx9y5AtDpcUZ_p66FXGTaMFFxnX3yLSw_9uE6FNifVh5HvHKTpHTRi4Nfg7R7pG2hbgATJWuM9V2oLZB0vuEdpxCOvkiLrWiDNySiuW9LxKYd53N0LdV3oRUWrezX7-cro77dUKgpxe_B24HqR55rNBL3C0ctlPqvJjdFP_ITl5JVMMM3LFIUlNfVilE2jT5UQTiHv9W205gT1u3Vq-BMWAKovYRe5zTvOODib8lfKYNvkLZ8Mb_PprMrVlqTUkR8JCDhVRwGwHagm0YsI4rA/media?maxWidthPx=800&maxHeightPx=600&key=REDACTED_API_KEY"
      }],
      osm_cuisine: "seafood;thai;italian"
    };

    const waldorf = {
      osm_id: 534769012,
      poi_type: "hotel",
      osm_name: "Waldorf Astoria Bangkok",
      osm_latitude: 13.742445670588237,
      osm_longitude: 100.54059995882353,
      osm_address: "151, Ratchadamri Road, 10330",
      osm_phone: "+66 2 846 8888",
      osm_website: "https://www.hilton.com/en/hotels/bkkwawa-waldorf-astoria-bangkok/",
      osm_stars: "5",
      google_place_id: "ChIJI9OICMWe4jARSD0xAYYV18I",
      google_display_name: {text: "Waldorf Astoria Bangkok", languageCode: "en"},
      google_address: "151 Thanon Ratchadamri, Khwaeng Lumphini, Pathum Wan, Krung Thep Maha Nakhon 10330, Thailand",
      google_phone: "02 846 8888",
      google_website: "https://www.hilton.com/en/hotels/bkkwawa-waldorf-astoria-bangkok/",
      google_rating: 4.7,
      google_review_count: 2545,
      google_photos: [{
        url: "https://places.googleapis.com/v1/places/ChIJI9OICMWe4jARSD0xAYYV18I/photos/AcnlKN3WoeCOrNVz-Hd_mpRgsKiyuSFVo34bF5BZ9PSUf2x0TxOmODa8Uc3WOi5RWq4LQpyIt6r7OZXpSCCVNLc6qN2bjkY2TeuetJ32NuOZqW9nh7Pyr1SeMFz145UUTR6iVXa20a4AWzsCCWQeZrzWAe-1oc5bnO1P25b6ZmP0oXAF28hsR0mYm61cJvZzrvyUqrRw0nO-WMKpQy9niwuMqZAurPto_sfXTc_GHdsoVSwOcsnevLUrVc6zDyXe38QdkIqwil-f6RU_CYV90JtaF4DdtC_H0VYLYGGcKmmJs7OBfA/media?maxWidthPx=800&maxHeightPx=600&key=REDACTED_API_KEY"
      }]
    };

    const foodTypes = ['restaurant', 'cafe', 'bar', 'pub', 'fast_food', 'food_court'];

    // Prepare POI data for template
    function preparePOI(poi) {
      let poiName = poi.osm_name || 'Unknown';
      if (poi.google_display_name?.text) {
        poiName = poi.google_display_name.text;
      }

      const address = poi.osm_address || poi.google_address || '';
      const address_lines = address.split(',').map(s => s.trim()).filter(Boolean);
      const opening_hours = poi.google_opening_hours?.weekdayDescriptions || [];
      const photo_url = poi.google_photos?.[0]?.url || null;
      const is_food = foodTypes.includes(poi.poi_type);
      const cuisine_list = poi.osm_cuisine
        ? poi.osm_cuisine.split(/[;,]/).map(c => c.trim().replace(/_/g, ' ')).filter(Boolean)
        : [];

      let mapsUrl = `https://www.google.com/maps?q=${poi.osm_latitude},${poi.osm_longitude}`;
      if (poi.google_place_id) {
        mapsUrl = `https://www.google.com/maps/search/?api=1&query=${poi.osm_latitude},${poi.osm_longitude}&query_place_id=${poi.google_place_id}`;
      }

      return { ...poi, poiName, address_lines, opening_hours, photo_url, is_food, cuisine_list, mapsUrl };
    }

    // Render on load
    document.addEventListener('DOMContentLoaded', function() {
      const template = Handlebars.compile(document.getElementById('poi-template').innerHTML);
      document.getElementById('coco51-container').innerHTML = template(preparePOI(coco51));
      document.getElementById('waldorf-container').innerHTML = template(preparePOI(waldorf));
    });
  </script>
</body>
</html>
