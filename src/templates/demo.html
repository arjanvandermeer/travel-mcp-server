<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POI Template Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .demo-header h1 { margin: 0 0 10px 0; color: #333; }
    .demo-header p { color: #666; margin: 0; }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .demo-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .demo-card-label {
      background: #333;
      color: white;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .poi-container {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>POI Details Template Demo</h1>
    <p>Client-side Handlebars rendering with hardcoded POI data</p>
  </div>

  <div class="demo-grid">
    <div class="demo-card">
      <div class="demo-card-label">Restaurant Example: Coco51</div>
      <div id="coco51-container" class="poi-container"></div>
    </div>

    <div class="demo-card">
      <div class="demo-card-label">Hotel Example: Waldorf Astoria Bangkok</div>
      <div id="waldorf-container" class="poi-container"></div>
    </div>
  </div>

  <!-- POI Details Template (matches poi-details.hbs) -->
  <script id="poi-template" type="text/x-handlebars-template">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      .poi-card {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        color: #333;
        line-height: 1.5;
      }
      .hero-image {
        width: 100%;
        height: 220px;
        object-fit: cover;
      }
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px;
      }
      .header h1 { font-size: 24px; margin-bottom: 8px; }
      .header .type-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
      .header .type { opacity: 0.9; font-size: 14px; text-transform: capitalize; }
      .header .stars { font-size: 14px; }
      .header .brand { opacity: 0.8; font-size: 13px; margin-top: 4px; }
      .header .rating { margin-top: 12px; font-size: 18px; }
      .header .price-level { opacity: 0.9; font-size: 14px; margin-left: 8px; }
      .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        margin-top: 8px;
      }
      .status-open { background: rgba(76, 175, 80, 0.9); }
      .status-closed { background: rgba(244, 67, 54, 0.9); }
      .status-temp-closed { background: rgba(255, 152, 0, 0.9); }
      .content { padding: 20px; }
      .card {
        background: white;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      .card h2 { font-size: 14px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
      .card p { font-size: 16px; }
      .card a { color: #667eea; text-decoration: none; }
      .card a:hover { text-decoration: underline; }
      .description { font-size: 15px; line-height: 1.6; color: #444; }
      .address-line { display: block; }
      .contact-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
      .contact-row a { display: block; margin-bottom: 6px; }
      .contact-row a:last-child { margin-bottom: 0; }
      .hours-list { list-style: none; font-size: 14px; }
      .hours-list li { padding: 4px 0; border-bottom: 1px solid #eee; }
      .hours-list li:last-child { border-bottom: none; }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; }
      .tag {
        background: #f0f0f0;
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 14px;
        text-transform: capitalize;
      }
      .info-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .info-item { font-size: 14px; }
      .info-item .label { color: #666; font-size: 12px; display: block; }
      .info-item .value { font-weight: 500; }
      .amenities-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .amenity {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }
      .amenity .icon { font-size: 16px; }
      .review-card {
        border-left: 3px solid #667eea;
        padding-left: 12px;
        margin-bottom: 16px;
      }
      .review-card:last-child { margin-bottom: 0; }
      .review-author { font-weight: 600; font-size: 14px; }
      .review-rating { color: #f5a623; font-size: 13px; margin: 4px 0; }
      .review-text { font-size: 14px; color: #555; line-height: 1.5; }
      .review-date { font-size: 12px; color: #999; margin-top: 4px; }
      .map-link {
        display: block;
        background: #667eea;
        color: white;
        text-align: center;
        padding: 14px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .map-link:hover { background: #5a6fd6; }
    </style>
    <div class="poi-card">
      {{#if photo_url}}
      <img class="hero-image" src="{{photo_url}}" alt="{{poiName}}">
      {{/if}}

      <div class="header">
        <div class="type-row">
          <span class="type">{{poi_type}}</span>
          {{#if starDisplay}}
          <span class="stars">{{starDisplay}}</span>
          {{/if}}
        </div>
        <h1>{{poiName}}</h1>
        {{#if osm_brand}}
        <div class="brand">by {{osm_brand}}</div>
        {{else}}
        {{#if osm_operator}}
        <div class="brand">by {{osm_operator}}</div>
        {{/if}}
        {{/if}}
        {{#if google_rating}}
        <div class="rating">
          {{formatRating google_rating}}
          {{#if google_review_count}}
          ({{google_review_count}} reviews)
          {{/if}}
          {{#if price_display}}
          <span class="price-level">{{price_display}}</span>
          {{/if}}
        </div>
        {{/if}}
        {{#if business_status_display}}
        <span class="status-badge {{business_status_class}}">{{business_status_display}}</span>
        {{/if}}
      </div>

      <div class="content">
        {{#if google_editorial_summary}}
        <div class="card">
          <h2>About</h2>
          <p class="description">{{google_editorial_summary}}</p>
        </div>
        {{/if}}

        {{#if address_lines}}
        <div class="card">
          <h2>Location & Contact</h2>
          {{#each address_lines}}
          <span class="address-line">{{this}}</span>
          {{/each}}
          {{#if ../has_contact}}
          <div class="contact-row">
            {{#if ../google_phone}}
            <a href="tel:{{../google_phone}}">{{../google_phone}}</a>
            {{else}}
            {{#if ../osm_phone}}
            <a href="tel:{{../osm_phone}}">{{../osm_phone}}</a>
            {{/if}}
            {{/if}}
            {{#if ../osm_email}}
            <a href="mailto:{{../osm_email}}">{{../osm_email}}</a>
            {{/if}}
          </div>
          {{/if}}
        </div>
        {{/if}}

        {{#if is_accommodation}}
        {{#if has_hotel_info}}
        <div class="card">
          <h2>Hotel Details</h2>
          <div class="info-grid">
            {{#if osm_rooms}}
            <div class="info-item">
              <span class="label">Rooms</span>
              <span class="value">{{osm_rooms}}</span>
            </div>
            {{/if}}
            {{#if osm_beds}}
            <div class="info-item">
              <span class="label">Beds</span>
              <span class="value">{{osm_beds}}</span>
            </div>
            {{/if}}
            {{#if osm_stars}}
            <div class="info-item">
              <span class="label">Star Rating</span>
              <span class="value">{{osm_stars}} stars</span>
            </div>
            {{/if}}
          </div>
        </div>
        {{/if}}
        {{/if}}

        {{#if is_food}}
        {{#if cuisine_list}}
        <div class="card">
          <h2>Cuisine</h2>
          <div class="tags">
            {{#each cuisine_list}}
            <span class="tag">{{this}}</span>
            {{/each}}
          </div>
        </div>
        {{/if}}
        {{/if}}

        {{#if service_options_list}}
        <div class="card">
          <h2>Services</h2>
          <div class="tags">
            {{#each service_options_list}}
            <span class="tag">{{this}}</span>
            {{/each}}
          </div>
        </div>
        {{/if}}

        {{#if amenities_list}}
        <div class="card">
          <h2>Amenities</h2>
          <div class="amenities-grid">
            {{#each amenities_list}}
            <div class="amenity">
              <span class="icon">{{icon}}</span>
              <span>{{name}}</span>
            </div>
            {{/each}}
          </div>
        </div>
        {{/if}}

        {{#if accessibility_list}}
        <div class="card">
          <h2>Accessibility</h2>
          <div class="tags">
            {{#each accessibility_list}}
            <span class="tag">{{this}}</span>
            {{/each}}
          </div>
        </div>
        {{/if}}

        {{#if website_display}}
        <div class="card">
          <h2>Website</h2>
          <p><a href="{{google_website}}" target="_blank">{{website_display}}</a></p>
        </div>
        {{else}}
        {{#if osm_website}}
        <div class="card">
          <h2>Website</h2>
          <p><a href="{{osm_website}}" target="_blank">{{osm_website}}</a></p>
        </div>
        {{/if}}
        {{/if}}

        {{#if opening_hours}}
        <div class="card">
          <h2>Opening Hours</h2>
          <ul class="hours-list">
            {{#each opening_hours}}
            <li>{{this}}</li>
            {{/each}}
          </ul>
        </div>
        {{/if}}

        {{#if reviews_list}}
        <div class="card">
          <h2>Reviews</h2>
          {{#each reviews_list}}
          <div class="review-card">
            <div class="review-author">{{author}}</div>
            <div class="review-rating">{{ratingStars}}</div>
            <p class="review-text">{{text}}</p>
            {{#if relativeTime}}
            <div class="review-date">{{relativeTime}}</div>
            {{/if}}
          </div>
          {{/each}}
        </div>
        {{/if}}

        <a class="map-link" href="{{mapsUrl}}" target="_blank">
          Open in Google Maps
        </a>
      </div>
    </div>
  </script>

    // Hardcoded POI data from database (with photo URLs and all enrichment data)
    const coco51 = {

    const waldorf = {

      },
      google_accessibility: {
        wheelchairAccessibleEntrance: true,
        wheelchairAccessibleRestroom: true,
        wheelchairAccessibleParking: true
      },

        {

        {

          rating: 4,
          text: { text: "Beautiful property with excellent amenities. The location near Ratchadamri BTS is very convenient. Only minor issue was some noise from construction nearby, but staff provided ear plugs and a room change offer." },
          relativePublishTimeDescription: "1 month ago"
        }
      ],
      google_maps_url: "https://maps.google.com/?cid=14042831474571672392"
    };

    const foodTypes = ['restaurant', 'cafe', 'bar', 'pub', 'fast_food', 'food_court'];
    const accommodationTypes = ['hotel', 'hostel', 'guest_house', 'motel', 'resort', 'apartment', 'bed_and_breakfast'];

    // Price level mapping
    const priceLevelMap = {
      PRICE_LEVEL_FREE: 'Free',
      PRICE_LEVEL_INEXPENSIVE: '$',
      PRICE_LEVEL_MODERATE: '$$',
      PRICE_LEVEL_EXPENSIVE: '$$$',
      PRICE_LEVEL_VERY_EXPENSIVE: '$$$$',
    };

    // Prepare POI data for template (mirrors renderPOIPreview in tools-config.js)
    function preparePOI(poi) {
      let poiName = poi.osm_name || 'Unknown';
      if (poi.google_display_name?.text) {
        poiName = poi.google_display_name.text;
      }

      const address = poi.osm_address || poi.google_address || '';
      const address_lines = address.split(',').map(s => s.trim()).filter(Boolean);
      const opening_hours = poi.google_opening_hours?.weekdayDescriptions || [];
      const photo_url = poi.google_photos?.[0]?.url || null;
      const is_food = foodTypes.includes(poi.poi_type);
      const is_accommodation = accommodationTypes.includes(poi.poi_type);
      const cuisine_list = poi.osm_cuisine
        ? poi.osm_cuisine.split(/[;,]/).map(c => c.trim().replace(/_/g, ' ')).filter(Boolean)
        : [];

      // Star display for hotels
      const starDisplay = poi.osm_stars ? '\u2605'.repeat(parseInt(poi.osm_stars, 10) || 0) : null;

      // Has hotel info
      const has_hotel_info = poi.osm_rooms || poi.osm_beds || poi.osm_stars;

      // Has contact info
      const has_contact = poi.google_phone || poi.osm_phone || poi.osm_email;

      // Price level display
      const price_display = poi.google_price_level ? priceLevelMap[poi.google_price_level] || null : null;

      // Business status display
      let business_status_display = null;
      let business_status_class = null;
      if (poi.google_business_status) {
        if (poi.google_business_status === 'CLOSED_PERMANENTLY') {
          business_status_display = 'Permanently Closed';
          business_status_class = 'status-closed';
        } else if (poi.google_business_status === 'CLOSED_TEMPORARILY') {
          business_status_display = 'Temporarily Closed';
          business_status_class = 'status-temp-closed';
        }
      }

      // Website display (shortened URL)
      let website_display = null;
      if (poi.google_website) {
        try {
          const url = new URL(poi.google_website);
          website_display = url.hostname.replace(/^www\./, '');
        } catch {
          website_display = poi.google_website;
        }
      }

      // Service options
      let service_options_list = null;
      if (poi.google_service_options) {
        const opts = poi.google_service_options;
        const services = [];
        if (opts.dineIn) services.push('Dine-in');
        if (opts.takeout) services.push('Takeout');
        if (opts.delivery) services.push('Delivery');
        if (opts.curbsidePickup) services.push('Curbside pickup');
        if (opts.servesBreakfast) services.push('Breakfast');
        if (opts.servesLunch) services.push('Lunch');
        if (opts.servesDinner) services.push('Dinner');
        if (opts.servesBrunch) services.push('Brunch');
        if (opts.servesBeer) services.push('Beer');
        if (opts.servesWine) services.push('Wine');
        if (opts.servesCocktails) services.push('Cocktails');
        if (opts.servesCoffee) services.push('Coffee');
        if (opts.servesDessert) services.push('Dessert');
        if (opts.servesVegetarianFood) services.push('Vegetarian options');
        if (opts.outdoorSeating) services.push('Outdoor seating');
        if (opts.liveMusic) services.push('Live music');
        if (opts.reservable) services.push('Reservations');
        if (services.length > 0) service_options_list = services;
      }

      // Amenities with icons
      let amenities_list = null;
      if (poi.google_amenities) {
        const amenities = poi.google_amenities;
        const items = [];
        if (amenities.restroom) items.push({ icon: '\uD83D\uDEBB', name: 'Restroom' });
        if (amenities.goodForChildren) items.push({ icon: '\uD83D\uDC76', name: 'Good for children' });
        if (amenities.goodForGroups) items.push({ icon: '\uD83D\uDC65', name: 'Good for groups' });
        if (amenities.goodForWatchingSports) items.push({ icon: '\uD83D\uDCFA', name: 'Sports viewing' });
        if (amenities.menuForChildren) items.push({ icon: '\uD83C\uDF7D\uFE0F', name: 'Kids menu' });
        if (amenities.paymentOptions?.acceptsCreditCards) items.push({ icon: '\uD83D\uDCB3', name: 'Credit cards' });
        if (amenities.paymentOptions?.acceptsCashOnly) items.push({ icon: '\uD83D\uDCB5', name: 'Cash only' });
        if (amenities.parkingOptions?.paidParkingLot) items.push({ icon: '\uD83C\uDD7F\uFE0F', name: 'Paid parking' });
        if (amenities.parkingOptions?.freeParkingLot) items.push({ icon: '\uD83C\uDD7F\uFE0F', name: 'Free parking' });
        if (amenities.parkingOptions?.streetParking) items.push({ icon: '\uD83D\uDE97', name: 'Street parking' });
        if (amenities.parkingOptions?.valetParking) items.push({ icon: '\uD83D\uDD11', name: 'Valet parking' });
        if (items.length > 0) amenities_list = items;
      }

      // Accessibility
      let accessibility_list = null;
      const accessItems = [];
      if (poi.osm_wheelchair === 'yes') accessItems.push('Wheelchair accessible');
      if (poi.osm_wheelchair === 'limited') accessItems.push('Limited wheelchair access');
      if (poi.google_accessibility) {
        const acc = poi.google_accessibility;
        if (acc.wheelchairAccessibleEntrance) accessItems.push('Wheelchair entrance');
        if (acc.wheelchairAccessibleRestroom) accessItems.push('Wheelchair restroom');
        if (acc.wheelchairAccessibleSeating) accessItems.push('Wheelchair seating');
        if (acc.wheelchairAccessibleParking) accessItems.push('Wheelchair parking');
      }
      if (accessItems.length > 0) accessibility_list = [...new Set(accessItems)];

      // Reviews (top 3)
      let reviews_list = null;
      if (poi.google_reviews && Array.isArray(poi.google_reviews) && poi.google_reviews.length > 0) {
        reviews_list = poi.google_reviews.slice(0, 3).map(review => ({
          author: review.authorAttribution?.displayName || 'Anonymous',
          ratingStars: '\u2605'.repeat(review.rating || 0) + '\u2606'.repeat(5 - (review.rating || 0)),
          text: review.text?.text || review.originalText?.text || '',
          relativeTime: review.relativePublishTimeDescription || null,
        })).filter(r => r.text);
      }

      // Maps URL
      let mapsUrl = `https://www.google.com/maps?q=${poi.osm_latitude},${poi.osm_longitude}`;
      if (poi.google_place_id) {
        mapsUrl = `https://www.google.com/maps/search/?api=1&query=${poi.osm_latitude},${poi.osm_longitude}&query_place_id=${poi.google_place_id}`;
      }

      return {
        ...poi,
        poiName,
        address_lines,
        opening_hours,
        photo_url,
        is_food,
        is_accommodation,
        cuisine_list,
        starDisplay,
        has_hotel_info,
        has_contact,
        price_display,
        business_status_display,
        business_status_class,
        website_display,
        service_options_list,
        amenities_list,
        accessibility_list,
        reviews_list,
        mapsUrl
      };
    }

    // Render on load
    document.addEventListener('DOMContentLoaded', function() {
      const template = Handlebars.compile(document.getElementById('poi-template').innerHTML);
      document.getElementById('coco51-container').innerHTML = template(preparePOI(coco51));
      document.getElementById('waldorf-container').innerHTML = template(preparePOI(waldorf));
    });
  </script>
</body>
</html>
